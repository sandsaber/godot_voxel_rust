[package]
name = "voxel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Engine-agnostic voxel engine core (math, storage, meshing, generation)"

[lib]
name = "voxel_core"
path = "src/lib.rs"

[dependencies]
# Pure-Rust LZ4 (no C, no FFI) — keeps Android/WASM cross-compilation clean.
# Used by `streams::compressed_data` for the LZ4/LZ4_BE block formats.
lz4_flex = "0.11"

# Zero-unsafe byte casts for typed channel storage (`ChannelData`). Pure Rust,
# Android/WASM-safe — used by `ChannelData::as_bytes` for wire-format parity
# (the block serializer treats channel payloads as opaque LE bytes, and
# `bytemuck::cast_slice` over a `Vec<u{16,32,64}>` reproduces the exact LE byte
# layout the previous `Vec<u8>` storage held), and by the mesher hot path
# (`VoxelBuffer::channel_typed_slice`) for zero-copy typed SDF slices,
# mirroring the C++ `Span::reinterpret_cast_to<T>()` depth-dispatch pattern.
bytemuck = "1"

# Pure-Rust port of FastNoiseLite (no C, no FFI) — used by
# `generators::simple::Noise` for 3D SDF terrain. Same rationale as lz4_flex:
# keeps Android/WASM cross-compilation clean, bit-compatible with Godot's
# engine FastNoiseLite for the same seed/frequency/type settings.
fastnoise-lite = "1.1"

# Persistent ordered maps keep transactional variable-LOD coverage previews
# cheap while preserving deterministic iteration order.
imbl = "=7.0.1"

# Optional ZSTD support. Off by default so the default build stays pure-Rust;
# enable for parity with the C++ CompressedData::COMPRESSION_ZSTD path. The
# `zstd` crate bundles a C library, which is why it lives behind a feature.
zstd = { version = "0.13", optional = true, default-features = false }

[dev-dependencies]
# Used for parity tests against C++ reference outputs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Criterion is used only by benches; declared here so `cargo bench` resolves it.
criterion = "0.5"

[features]
default = []
# Enable debug allocation counters (mirrors C++ StdDefaultAllocatorCounters).
# Off by default to avoid atomic overhead in hot paths.
alloc-counters = []
# Enable ZSTD compression/decompression parity with the C++ CompressedData path.
# Off by default to keep the runtime dependency tree pure-Rust (Android/WASM).
# When disabled, ZSTD streams parse but return `Unsupported` on de/compress.
zstd = ["dep:zstd"]

# `cargo bench` entry point. `harness = false` lets criterion provide main().
[[bench]]
name = "transvoxel_bench"
harness = false

# H2-MT: end-to-end MeshBlockTask throughput (single + multi-threaded paging).
[[bench]]
name = "mesh_block_bench"
harness = false

# Phase E item 7: Variable LOD hot-path benchmarks (steady-state tick,
# enter-burst tick, packed-array voxel access, buffer lifecycle).
[[bench]]
name = "variable_lod_bench"
harness = false

# End-to-end mesh-block-task benchmark (generator gap-fill + gather + build)
# and a multi-threaded worker-scaling scenario. Measures the MeshBlockTask
# level with a shared MeshArraysPool — raw thread scaling, unlike
# mesh_block_bench which goes through the ThreadedTaskRunner.
[[bench]]
name = "block_task_bench"
harness = false
