name: Rust Fuzz

# Phase E: scheduled bounded fuzzing of voxel-core's byte-level parsers
# (region_file, block_serializer, vox_parser). Catches malformed-input
# panics/UB without requiring a full run-to-completion.
on:
  schedule:
    # Weekly, Sunday 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        target: [region_file, block_serializer, vox_parser]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-fuzz-${{ matrix.target }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock', 'rust/fuzz/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ matrix.target }}-
            ${{ runner.os }}-fuzz-

      - name: Install nightly Rust + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          rustup show
          cargo install cargo-fuzz --locked || true

      - name: Run ${{ matrix.target }} fuzzer (60s bounded)
        run: |
          set +e
          timeout 70 cargo +nightly fuzz run ${{ matrix.target }} fuzz/seed_corpus/${{ matrix.target }} -- -max_total_time=60 -max_len=4096
          ec=$?
          # timeout exits 124 on a clean time-out (success); real crashes are non-124 non-zero.
          if [ "$ec" = "124" ]; then exit 0; fi
          exit "$ec"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: rust/fuzz/artifacts/
          retention-days: 14
