name: Rust Fuzz

# Phase E: scheduled bounded fuzzing of voxel-core's byte-level parsers
# (region_file, block_serializer, vox_parser). Catches malformed-input
# panics/UB without requiring a full run-to-completion.
on:
  schedule:
    # Weekly, Sunday 03:00 UTC.
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        target: [region_file, block_serializer, vox_parser]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/fuzz/target
          key: ${{ runner.os }}-fuzz-v2-${{ matrix.target }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock', 'rust/fuzz/Cargo.toml', 'rust/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-v2-${{ matrix.target }}-
            ${{ runner.os }}-fuzz-v2-

      - name: Install nightly Rust + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          rustup show
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Build ${{ matrix.target }} fuzzer
        timeout-minutes: 15
        run: cargo +nightly fuzz build ${{ matrix.target }}

      - name: Run ${{ matrix.target }} fuzzer (60s bounded)
        timeout-minutes: 3
        # libFuzzer exits successfully after its own 60s budget. A timeout
        # of the outer process is a failure, including an unexpected rebuild.
        run: timeout 120 cargo +nightly fuzz run ${{ matrix.target }} fuzz/seed_corpus/${{ matrix.target }} -- -max_total_time=60 -max_len=4096

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: rust/fuzz/artifacts/
          retention-days: 14
