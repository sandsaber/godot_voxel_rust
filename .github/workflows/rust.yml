name: Rust

# In-dev: PRs only run the cheap workspace gate. Godot smoke and Android
# are still flaky around GDExtension loading; run them from Actions →
# "Rust" → Run workflow when you want the full check.
on:
  pull_request:
  workflow_dispatch:

concurrency:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Run clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --workspace --release

      - name: Manifest gate (voxel-gdext port status)
        run: cargo test --locked -p voxel-gdext --test port_status

      - name: Build workspace
        run: cargo build --workspace

  godot-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-rust-smoke-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-smoke-
            ${{ runner.os }}-rust-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install Godot 4.7 (headless)
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.1"
          ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${ARCHIVE}"
          unzip -q "${ARCHIVE}" -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          # Expose as `godot` on PATH for the smoke driver.
          sudo mv "godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Run Godot smoke tests (5 scenes)
        run: ./voxel-gdext/smoke_test/run_smoke_test.sh

  android-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-rust-android-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-android-
            ${{ runner.os }}-rust-

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android aarch64 GDExtension
        run: ./scripts/android-build.sh
